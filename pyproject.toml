[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "femuralabs"
version = "0.1.0"
description = "Lower-limb CT analysis pipeline and ML segmentation."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "SimpleITK>=2.3.0",
    "scikit-image>=0.22.0",
    "numpy>=1.24.0",
]

[project.scripts]
femuralabs = "femuralabs.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]